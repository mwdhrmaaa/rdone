<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rdone - Premium Workout Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="rdone.webmanifest?v=3">
    <meta name="theme-color" content="#0c0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="rdone">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="rdone-512.png?v=3">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>rdone</h1>
                <button id="close-sidebar" class="btn-icon mobile-only">✕</button>
            </div>
            <nav>
                <button class="nav-item" data-tab="dashboard">
                    <span class="icon">📊</span> Dashboard
                </button>
                <button class="nav-item active" data-tab="schedule">
                    <span class="icon">📅</span> Schedule
                </button>
                <button class="nav-item" data-tab="journal">
                    <span class="icon">📝</span> Logs
                </button>
            </nav>
            <div class="sidebar-footer">
                <p>Welcome back!</p>
                <button class="btn-text" id="reset-app" style="color: var(--danger); font-size: 0.75rem; margin-top: 8px; opacity: 0.6; cursor: pointer;">↺ Reset to Default</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-left">
                    <button id="sidebar-toggle" class="btn-icon">☰</button>
                    <h2 id="tab-title">Dashboard</h2>
                </div>
                <div class="user-profile">
                    <div class="avatar">S</div>
                </div>
            </header>

            <!-- Dashboard Tab -->
            <section id="dashboard" class="tab-content">
                <div class="dashboard-grid">
                    <div class="stat-card prime">
                        <div class="stat-info">
                            <h3>Today's Focus</h3>
                            <div id="today-workout-name" class="stat-value">Rest Day</div>
                            <p id="today-workout-meta">Recovery is key</p>
                        </div>
                        <div class="stat-icon">🔥</div>
                    </div>
                    <div class="stat-card">
                        <h3>Scheduled Tasks</h3>
                        <div id="total-scheduled" class="stat-value">0</div>
                        <p>For this week</p>
                    </div>

                </div>

                <div class="section-container">
                    <h3>Today's Routine</h3>
                    <div id="today-routine-list" class="routine-list">
                        <!-- Dynamically populated -->
                        <div class="empty-state">No workouts scheduled for today.</div>
                    </div>
                </div>
            </section>


            <!-- Schedule Tab -->
            <section id="schedule" class="tab-content active">
                <div class="tab-header">
                    <h3>Weekly Planner</h3>
                    <button class="btn btn-primary" id="open-schedule-modal">+ Schedule Workout</button>
                </div>
                <div class="calendar-view">
                    <!-- Weekdays -->
                    <div class="calendar-days" id="calendar-days">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </section>

            <!-- Journal Tab -->
            <section id="journal" class="tab-content">
                <div class="tab-header">
                    <h3>Workout Logs</h3>
                    <button class="btn btn-primary" id="open-journal-modal">+ New Log</button>
                </div>
                <div id="journal-list" class="journal-list">
                    <!-- Dynamically populated -->
                </div>
            </section>
        </main>
    </div>


    <div id="schedule-modal" class="modal">
        <div class="modal-content">
            <h3>Schedule Workout</h3>
            <form id="schedule-form">
                <div class="form-group">
                    <label>Workout Name</label>
                    <input type="text" id="schedule-workout-name" list="workout-options" required placeholder="Type or select a workout...">
                    <datalist id="workout-options"></datalist>
                </div>
                <div class="form-group">
                    <label>Day</label>
                    <select id="schedule-day" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Time (Optional)</label>
                    <input type="time" id="schedule-time">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Schedule Now</button>
                </div>
            </form>
        </div>
    </div>

    <div id="journal-modal" class="modal">
        <div class="modal-content">
            <h3>Log Completed Workout</h3>
            <form id="journal-form">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="journal-date" required>
                </div>
                <div class="form-group">
                    <label>Workout Performed</label>
                    <input type="text" id="journal-title" list="workout-options" required placeholder="e.g. Chest Press or 5km Run">
                </div>
                <div class="form-group">
                    <label>Performance Notes</label>
                    <textarea id="journal-content" rows="4" placeholder="e.g. 3 sets of 12 reps @ 60kg. Felt strong!"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Log</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal (Premium) -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content confirm-box">
            <div class="confirm-icon">⚠️</div>
            <h3 id="confirm-title">Are you sure?</h3>
            <p id="confirm-message">This action cannot be undone.</p>
            <div class="modal-actions full-width">
                <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-ok">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
